services:

  nginx:
      image: nginx:alpine
      container_name: proxy_nginx
      ports:
        - "80:80"
      volumes:
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      networks:
        - red-cba
      depends_on:
        - app_backend
  servidor-bd:
    image: mysql:8.0
    container_name: servidor-bd
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - red-cba

  app_backend:
    image: luuxia/app-backend:v1
    container_name: app-backend
    environment:
      FLASK_ENV: development
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    networks:
      - red-cba
    depends_on:
      - servidor-bd
    ports:
      - "5050:5050"

networks:
  red-cba:
    name: red-cba

volumes:
  mysql-data:
    name: mysql-data